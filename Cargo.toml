[package]
name = "y86c"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
ariadne = "0.6.0"
clap = { version = "4.6.4", features = ["derive"] }
hashbrown = { version = "0.17.1", default-features = false, features = ["allocator-api2", "equivalent", "inline-more"] }
indexmap = "2.14.0"
petgraph = "0.8.3"
regalloc3 = { git = "https://github.com/amanieu/regalloc3", version = "0.1.0" }
smol_str = "0.3.6"
tinyvec = { version = "1.12.0", features = ["alloc"] }
